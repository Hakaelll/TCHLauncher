[package]
name = "tchlauncher"
version = "0.44.0"
description = "Local Minecraft server manager"
authors = ["TCHLauncher contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "tchlauncher_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "=1.1.6"
yaml-rust2 = {version="=0.13.0",default-features=false}
roxmltree = "0.21.1"
rusqlite = { version = "0.40", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "sync", "time", "net", "io-util", "rt"] }
uuid = { version = "1", features = ["v4"] }
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.39"
zip = "2"
tar = "0.4"
flate2 = "1"
walkdir = "2"
chrono = "0.4"
rfd = "0.15"
base64 = "0.22"
image = {version = "0.25",default-features = false,features = ["png", "jpeg", "webp"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55.0"
webview2-com = "0.39.1"
windows-core = "0.62.2"

# Tests inherit this profile. Keep rebuildable development output small.
[profile.dev]
debug = 0
incremental = false
